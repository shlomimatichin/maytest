<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לומדים אנגלית - English Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease-in;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            padding: 25px;
            font-size: 1.8em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Arial', sans-serif;
        }

        .menu-btn.active-mode {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .menu-btn.active-mode:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.5);
        }

        .menu-btn.disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .group-select {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            border: 3px solid #667eea;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Arial', sans-serif;
            background: white;
            color: #333;
        }

        /* Flashcard Screen */
        .back-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .flashcard {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .word-field {
            text-align: center;
            width: 100%;
        }

        .field-label {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .field-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .english {
            color: #4a90e2;
            direction: ltr;
        }

        .hebrew {
            color: #e24a4a;
        }

        .phonetic {
            color: #50c878;
        }

        .question-marks {
            color: #ccc;
            font-size: 3em;
        }

        .action-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
            transition: all 0.3s;
            font-family: 'Arial', sans-serif;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.5);
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        /* Spelling Mode Button */
        .menu-btn.spelling-mode {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 25px rgba(250, 112, 154, 0.4);
        }

        .menu-btn.spelling-mode:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(250, 112, 154, 0.5);
        }

        /* Spelling Game Screen */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            font-size: 1.2em;
            color: #333;
        }

        .stats strong {
            color: #667eea;
            margin-right: 5px;
        }

        .spelling-card {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .input-section {
            width: 100%;
            text-align: center;
        }

        .spelling-input {
            width: 100%;
            padding: 15px;
            font-size: 1.5em;
            border: 3px solid #4a90e2;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s;
        }

        .spelling-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .spelling-input.correct {
            border-color: #50c878;
            background: #e8f8f0;
        }

        .spelling-input.incorrect {
            border-color: #ff6b6b;
            background: #ffe8e8;
            animation: shake 0.5s;
        }

        .feedback-message {
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 30px;
        }

        .feedback-message.correct {
            color: #50c878;
        }

        .feedback-message.incorrect {
            color: #ff6b6b;
        }

        /* Confetti Container */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        .confetti-container.active {
            display: block;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confettiFall 2s linear forwards;
        }

        .star {
            position: absolute;
            font-size: 3em;
            animation: starBurst 2s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                top: -10%;
                opacity: 1;
                transform: translateX(0) rotateZ(0deg);
            }
            100% {
                top: 100%;
                opacity: 0;
                transform: translateX(var(--x-drift)) rotateZ(720deg);
            }
        }

        @keyframes starBurst {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }

            .menu-btn {
                font-size: 1.5em;
                padding: 20px;
            }

            .field-value {
                font-size: 2em;
            }

            .flashcard {
                padding: 30px 15px;
                min-height: 350px;
            }

            .spelling-card {
                padding: 30px 15px;
                min-height: 350px;
            }

            .spelling-input {
                font-size: 1.2em;
            }

            .stats {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu Screen -->
        <div id="menuScreen" class="screen active">
            <h1>🎓 לומדים אנגלית</h1>
            <select id="groupSelect" class="group-select">
                <option value="all">כל המילים למבחן</option>
                <option value="prep">מילות יחס</option>
                <option value="p8">עמוד 8</option>
                <option value="p10">עמוד 10</option>
                <option value="p12">עמוד 12</option>
            </select>
            <div class="menu-buttons">
                <button class="menu-btn active-mode" onclick="startFlashcards()">
                    כרטיסיה
                </button>
                <button class="menu-btn active-mode spelling-mode" onclick="startRandomMode()">
                    אקראי
                </button>
                <button class="menu-btn active-mode spelling-mode" onclick="startTestMode()">
                    מבחן
                </button>
            </div>
        </div>

        <!-- Flashcard Screen -->
        <div id="flashcardScreen" class="screen">
            <button class="back-btn" onclick="goToMenu()">← חזרה</button>

            <div class="flashcard">
                <div class="word-field">
                    <div class="field-label">English</div>
                    <div id="englishValue" class="field-value english">???</div>
                </div>

                <div class="word-field">
                    <div class="field-label">עברית</div>
                    <div id="hebrewValue" class="field-value hebrew">???</div>
                </div>

                <div class="word-field">
                    <div class="field-label">הגייה</div>
                    <div id="phoneticValue" class="field-value phonetic">???</div>
                </div>
            </div>

            <button id="actionBtn" class="action-btn" onclick="handleAction()">
                גלה
            </button>
        </div>

        <!-- Random Mode Screen -->
        <div id="randomModeScreen" class="screen">
            <button class="back-btn" onclick="goToMenu()">← חזרה</button>

            <div class="stats">
                <span>ניסיונות: <strong id="randomTotalAttempts">0</strong></span>
                <span>נכונות: <strong id="randomCorrectAttempts">0</strong></span>
            </div>

            <div class="spelling-card">
                <div class="word-field">
                    <div class="field-label">English</div>
                    <div id="randomEnglish" class="field-value english">???</div>
                </div>

                <div class="input-section">
                    <div class="field-label">עברית</div>
                    <input
                        type="text"
                        id="randomInput"
                        class="spelling-input"
                        placeholder="הקלד את המילה בעברית..."
                        dir="rtl"
                    />
                    <div id="randomFeedback" class="feedback-message"></div>
                </div>
            </div>

            <button id="randomActionBtn" class="action-btn" onclick="handleRandomAction()">
                בדוק
            </button>
        </div>

        <!-- Test Mode Screen -->
        <div id="testModeScreen" class="screen">
            <button class="back-btn" onclick="goToMenu()">← חזרה</button>

            <div class="stats">
                <span>התקדמות: <strong id="testProgress">0/0</strong></span>
                <span>נכונות: <strong id="testCorrectCount">0</strong></span>
            </div>

            <div class="spelling-card">
                <div class="word-field">
                    <div class="field-label">English</div>
                    <div id="testEnglish" class="field-value english">???</div>
                </div>

                <div class="input-section">
                    <div class="field-label">עברית</div>
                    <input
                        type="text"
                        id="testInput"
                        class="spelling-input"
                        placeholder="הקלד את המילה בעברית..."
                        dir="rtl"
                    />
                    <div id="testFeedback" class="feedback-message"></div>
                </div>
            </div>

            <button id="testActionBtn" class="action-btn" onclick="handleTestAction()">
                בדוק
            </button>
        </div>

        <!-- Test Results Screen -->
        <div id="testResultsScreen" class="screen">
            <h1 style="text-align: center; color: #667eea; margin-bottom: 30px;">תוצאות המבחן</h1>

            <div class="flashcard" style="min-height: 300px;">
                <div class="word-field">
                    <div class="field-label">ציון</div>
                    <div id="finalScore" class="field-value" style="font-size: 4em; color: #667eea;">0</div>
                </div>

                <div class="word-field">
                    <div class="field-label">תשובות נכונות</div>
                    <div id="finalCorrect" class="field-value" style="font-size: 2em; color: #50c878;">0</div>
                </div>

                <div class="word-field">
                    <div class="field-label">סך הכל</div>
                    <div id="finalTotal" class="field-value" style="font-size: 2em; color: #666;">0</div>
                </div>
            </div>

            <button class="action-btn" onclick="goToMenu()">
                חזרה לתפריט
            </button>
        </div>

        <!-- Confetti Container -->
        <div id="confettiContainer" class="confetti-container"></div>
    </div>

    <script>
        // Word database
const words = [
    // 📍 מילות יחס - Prepositions
    { group: 'prep', english: 'in', hebrew: 'בתוך', phonetic: 'אין' },

    // 📘 עמוד 8

    { group: 'p8', english: 'cake', hebrew: 'עוגה', phonetic: 'קייק' },

    { group: 'p8', english: 'notebook', hebrew: 'מחברת', phonetic: 'נוטבוק' },
    { group: 'p8', english: 'pencil', hebrew: 'עיפרון / עפרון', phonetic: 'פנסיל' },
    { group: 'p8', english: 'shoes', hebrew: 'נעליים / נעלים', phonetic: 'שוז' },
    { group: 'p8', english: 'sister', hebrew: 'אחות', phonetic: 'סיסטר' },
    { group: 'p8', english: 'socks', hebrew: 'גרביים / גרבים', phonetic: 'סוקס' },
    { group: 'p8', english: 'store', hebrew: 'חנות', phonetic: 'סטור' },

    // 📗 עמוד 10
    { group: 'p10', english: 'bears', hebrew: 'דובים', phonetic: 'בֵּרְז' },
    { group: 'p10', english: 'boat', hebrew: 'סירה', phonetic: 'בוט' },
    { group: 'p10', english: 'bread', hebrew: 'לחם', phonetic: 'ברד' },
    { group: 'p10', english: 'car', hebrew: 'מכונית / אוטו', phonetic: 'קאר' },
    { group: 'p10', english: 'chicken', hebrew: 'עוף / תרנגולת', phonetic: 'צ׳יקן' },
    { group: 'p10', english: 'coffee', hebrew: 'קפה', phonetic: 'קופי' },
    { group: 'p10', english: 'cola', hebrew: 'קולה', phonetic: 'קולה' },
    { group: 'p10', english: 'elephants', hebrew: 'פילים', phonetic: 'אלפנטס' },
    { group: 'p10', english: 'fruit', hebrew: 'פרי / פירות', phonetic: 'פרוט' },
    { group: 'p10', english: 'homework', hebrew: 'שיעורי בית', phonetic: 'הומוורק' },
    { group: 'p10', english: 'ice cream', hebrew: 'גלידה', phonetic: 'אייס קרים' },
    { group: 'p10', english: 'juice', hebrew: 'מיץ', phonetic: 'ג׳וס' },
    { group: 'p10', english: 'kittens', hebrew: 'גורי חתולים / חתלתולים', phonetic: 'קיטנס' },
    { group: 'p10', english: 'party', hebrew: 'מסיבה', phonetic: 'פארטי' },
    { group: 'p10', english: 'plane', hebrew: 'מטוס', phonetic: 'פליין' },
    { group: 'p10', english: 'rabbits', hebrew: 'ארנבים / ארנבונים', phonetic: 'ראביטס' },
    { group: 'p10', english: 'show', hebrew: 'הופעה / מופע', phonetic: 'שואו' },
    { group: 'p10', english: 'story', hebrew: 'סיפור', phonetic: 'סטורי' },
    { group: 'p10', english: 'train', hebrew: 'רכבת', phonetic: 'טריין' },
    { group: 'p10', english: 'water', hebrew: 'מים', phonetic: 'ווטר' },

    // 📙 עמוד 12
    { group: 'p12', english: 'boy', hebrew: 'ילד / בן', phonetic: 'בוי' },
    { group: 'p12', english: 'grandfather', hebrew: 'סבא', phonetic: 'גרנדפאד׳ר' },
    { group: 'p12', english: 'grandmother', hebrew: 'סבתא', phonetic: 'גרנדמאד׳ר' },
    { group: 'p12', english: 'king', hebrew: 'מלך', phonetic: 'קינג' },
    { group: 'p12', english: 'policeman', hebrew: 'שוטר', phonetic: 'פוליסמן' },
    { group: 'p12', english: 'queen', hebrew: 'מלכה', phonetic: 'קווין' },
    { group: 'p12', english: 'wolf', hebrew: 'זאב', phonetic: 'וולף' },
    { group: 'p12', english: 'cold', hebrew: 'קר', phonetic: 'קולד' },
    { group: 'p12', english: 'funny', hebrew: 'מצחיק', phonetic: 'פאני' },
    { group: 'p12', english: 'happy', hebrew: 'שמח', phonetic: 'האפי' },
    { group: 'p12', english: 'hungry', hebrew: 'רעב', phonetic: 'האנגרי' },
    { group: 'p12', english: 'tired', hebrew: 'עייף', phonetic: 'טאיירד' },
    { group: 'p12', english: 'wet', hebrew: 'רטוב', phonetic: 'ווט' },
];

        // Topic filter (chosen on the menu)
        function activeWords() {
            const group = document.getElementById('groupSelect').value;
            return group === 'all' ? words : words.filter(w => w.group === group);
        }

        // Accept any of the answers separated by "/" and ignore extra spaces
        function normalize(text) {
            return text.trim().replace(/\s+/g, ' ');
        }

        function isCorrect(word, answer) {
            return word.hebrew.split('/').some(opt => normalize(opt) === normalize(answer));
        }

        let currentWord = null;
        let isRevealed = false;

        // Navigation functions
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function goToMenu() {
            showScreen('menuScreen');
        }

        function startFlashcards() {
            showScreen('flashcardScreen');
            loadNewWord();
        }

        // Flashcard logic
        function loadNewWord() {
            // Pick a random word
            const list = activeWords();
            currentWord = list[Math.floor(Math.random() * list.length)];

            // Reset state
            isRevealed = false;

            // Update display
            updateDisplay();

            // Reset button
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.textContent = 'גלה';
        }

        function updateDisplay() {
            const englishEl = document.getElementById('englishValue');
            const hebrewEl = document.getElementById('hebrewValue');
            const phoneticEl = document.getElementById('phoneticValue');

            // Always show English
            englishEl.innerHTML = currentWord.english;
            englishEl.classList.remove('question-marks');

            if (isRevealed) {
                // Show Hebrew and phonetic
                hebrewEl.innerHTML = currentWord.hebrew;
                hebrewEl.classList.remove('question-marks');

                phoneticEl.innerHTML = currentWord.phonetic;
                phoneticEl.classList.remove('question-marks');
            } else {
                // Hide Hebrew and phonetic
                hebrewEl.innerHTML = '???';
                hebrewEl.classList.add('question-marks');

                phoneticEl.innerHTML = '???';
                phoneticEl.classList.add('question-marks');
            }
        }

        function handleAction() {
            const actionBtn = document.getElementById('actionBtn');

            if (!isRevealed) {
                // Reveal all fields
                isRevealed = true;
                updateDisplay();
                actionBtn.textContent = 'הבא';
            } else {
                // Load next word
                loadNewWord();
            }
        }

        // Random Mode Variables
        let randomCurrentWord = null;
        let randomIsChecked = false;
        let randomTotalAttempts = 0;
        let randomCorrectAttempts = 0;

        // Random Mode Functions
        function startRandomMode() {
            showScreen('randomModeScreen');
            loadNewRandomWord();
        }

        function loadNewRandomWord() {
            // Pick a random word
            const list = activeWords();
            randomCurrentWord = list[Math.floor(Math.random() * list.length)];
            randomIsChecked = false;

            // Update display
            document.getElementById('randomEnglish').textContent = randomCurrentWord.english;

            // Reset input and feedback
            const input = document.getElementById('randomInput');
            input.value = '';
            input.className = 'spelling-input';
            input.disabled = false;
            input.focus();

            const feedback = document.getElementById('randomFeedback');
            feedback.textContent = '';
            feedback.className = 'feedback-message';

            // Reset button
            const actionBtn = document.getElementById('randomActionBtn');
            actionBtn.textContent = 'בדוק';
        }

        function updateRandomStats() {
            document.getElementById('randomTotalAttempts').textContent = randomTotalAttempts;
            document.getElementById('randomCorrectAttempts').textContent = randomCorrectAttempts;
        }

        function handleRandomAction() {
            if (!randomIsChecked) {
                // Check the answer
                checkRandomAnswer();
            } else {
                // Load next word
                loadNewRandomWord();
            }
        }

        function checkRandomAnswer() {
            const input = document.getElementById('randomInput');
            const userAnswer = input.value.trim();
                        const feedback = document.getElementById('randomFeedback');
            const actionBtn = document.getElementById('randomActionBtn');

            randomIsChecked = true;
            randomTotalAttempts++;
            input.disabled = true;

            if (isCorrect(randomCurrentWord, userAnswer)) {
                // Correct answer
                randomCorrectAttempts++;
                input.classList.add('correct');
                feedback.textContent = '✓ נכון! ' + randomCurrentWord.hebrew;
                feedback.className = 'feedback-message correct';

                // Show confetti and stars
                showConfetti();
            } else {
                // Incorrect answer
                input.classList.add('incorrect');
                feedback.textContent = '✗ לא נכון. התשובה הנכונה: ' + randomCurrentWord.hebrew;
                feedback.className = 'feedback-message incorrect';
            }

            // Update stats
            updateRandomStats();

            // Change button to "next"
            actionBtn.textContent = 'הבא';
        }

        // Allow Enter key to submit in random mode
        document.addEventListener('DOMContentLoaded', function() {
            const randomInput = document.getElementById('randomInput');
            if (randomInput) {
                randomInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleRandomAction();
                    }
                });
            }

            const testInput = document.getElementById('testInput');
            if (testInput) {
                testInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleTestAction();
                    }
                });
            }
        });

        // Test Mode Variables
        let testWords = [];
        let testCurrentIndex = 0;
        let testCorrectCount = 0;
        let testIsChecked = false;

        // Test Mode Functions
        function startTestMode() {
            // Shuffle all words
            testWords = [...activeWords()].sort(() => Math.random() - 0.5);
            testCurrentIndex = 0;
            testCorrectCount = 0;
            testIsChecked = false;

            showScreen('testModeScreen');
            loadTestWord();
        }

        function loadTestWord() {
            const currentWord = testWords[testCurrentIndex];
            testIsChecked = false;

            // Update display
            document.getElementById('testEnglish').textContent = currentWord.english;

            // Update progress
            document.getElementById('testProgress').textContent = `${testCurrentIndex + 1}/${testWords.length}`;
            document.getElementById('testCorrectCount').textContent = testCorrectCount;

            // Reset input and feedback
            const input = document.getElementById('testInput');
            input.value = '';
            input.className = 'spelling-input';
            input.disabled = false;
            input.focus();

            const feedback = document.getElementById('testFeedback');
            feedback.textContent = '';
            feedback.className = 'feedback-message';

            // Reset button
            const actionBtn = document.getElementById('testActionBtn');
            actionBtn.textContent = 'בדוק';
        }

        function handleTestAction() {
            if (!testIsChecked) {
                // Check the answer
                checkTestAnswer();
            } else {
                // Move to next word or show results
                testCurrentIndex++;
                if (testCurrentIndex < testWords.length) {
                    loadTestWord();
                } else {
                    showTestResults();
                }
            }
        }

        function checkTestAnswer() {
            const currentWord = testWords[testCurrentIndex];
            const input = document.getElementById('testInput');
            const userAnswer = input.value.trim();
                        const feedback = document.getElementById('testFeedback');
            const actionBtn = document.getElementById('testActionBtn');

            testIsChecked = true;
            input.disabled = true;

            if (isCorrect(currentWord, userAnswer)) {
                // Correct answer
                testCorrectCount++;
                input.classList.add('correct');
                feedback.textContent = '✓ נכון! ' + currentWord.hebrew;
                feedback.className = 'feedback-message correct';

                // Update correct count
                document.getElementById('testCorrectCount').textContent = testCorrectCount;

                // Show confetti and stars
                showConfetti();
            } else {
                // Incorrect answer
                input.classList.add('incorrect');
                feedback.textContent = '✗ לא נכון. התשובה הנכונה: ' + currentWord.hebrew;
                feedback.className = 'feedback-message incorrect';
            }

            // Change button text
            if (testCurrentIndex < testWords.length - 1) {
                actionBtn.textContent = 'הבא';
            } else {
                actionBtn.textContent = 'סיים';
            }
        }

        function showTestResults() {
            const total = testWords.length;
            const correct = testCorrectCount;
            const score = Math.round((correct / total) * 100);

            // Update results display
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCorrect').textContent = correct;
            document.getElementById('finalTotal').textContent = total;

            // Show results screen
            showScreen('testResultsScreen');

            // Show confetti if score is high
            if (score >= 80) {
                showConfetti();
            }
        }

        function showConfetti() {
            const container = document.getElementById('confettiContainer');
            container.classList.add('active');

            // Create confetti particles
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3', '#00bcd4', '#4caf50', '#ffeb3b', '#ff9800'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.setProperty('--x-drift', (Math.random() * 200 - 100) + 'px');
                    container.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 2000);
                }, i * 20);
            }

            // Create stars
            const starPositions = [
                { top: '20%', left: '20%' },
                { top: '20%', left: '80%' },
                { top: '50%', left: '50%' },
                { top: '70%', left: '30%' },
                { top: '70%', left: '70%' }
            ];

            starPositions.forEach((pos, index) => {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.textContent = '⭐';
                    star.style.top = pos.top;
                    star.style.left = pos.left;
                    container.appendChild(star);

                    setTimeout(() => star.remove(), 2000);
                }, index * 100);
            });

            // Hide confetti container after animation
            setTimeout(() => {
                container.classList.remove('active');
            }, 2000);
        }

    </script>
</body>
</html>
